[package]
rust-version.workspace = true
name = "sdkwork-knowledgebase-pc-desktop"
version = "0.1.0"
description = "SDKWork Knowledgebase PC desktop host shell."
authors = ["SDKWork"]
license = "SEE LICENSE IN LICENSE"
edition = "2021"


[lints]
workspace = true
[workspace]


[workspace.package]
edition = "2021"
rust-version = "1.85"
[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
open = "5"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync"] }
typst = "0.14"
typst-as-lib = "0.15"
typst-pdf = "0.14"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
winreg = "0.55"
