[package]
name = "sdkwork-knowledgebase-rpc-sdk-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[workspace]


[workspace.package]
edition = "2024"
rust-version = "1.85"
[workspace.lints.rust]
# Generated RPC-client baseline (RUST_CODE_SPEC section 13 recommended block,
# narrowed to what generated code satisfies without local allows): the crate
# contains no unsafe and no panic/unwrap/expect paths.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lib]
name = "sdkwork_knowledgebase_rpc_sdk_rust"

[lints]
workspace = true

[dependencies]
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tokio-stream = "0.1"
