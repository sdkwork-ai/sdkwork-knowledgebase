# sdkwork-knowledgebase docker test domains -> static portal + container gateway.
# Windows hosts: 127.0.0.1 testapikb.sdkwork.com testapikb.birdcoder.com testapikb.noaper.com testapikb.dtupay.com
# The PC portal is served as a static SPA from the deploy root; the API plane
# paths (/app/v3/api, /backend/v3/api, /knowledge/v3/api, /internal/v3/api) and
# the infrastructure probes proxy to the compose-published gateway on
# 127.0.0.1:3904. The portal build uses same-origin API URLs, so the real
# domain is preserved end to end.
server {
    listen 80;
    listen [::]:80;
    server_name testapikb.sdkwork.com testapikb.birdcoder.com testapikb.noaper.com testapikb.dtupay.com;

    access_log /var/log/nginx/testapikb-knowledgebase.access.log;
    error_log /var/log/nginx/testapikb-knowledgebase.error.log;

    root /opt/sdkwork/knowledgebase/portal;
    index index.html;
    client_max_body_size 32m;

    # Infrastructure probes -> gateway (HEALTH_CHECK_SPEC: /healthz /readyz /livez).
    location = /healthz {
        proxy_pass http://127.0.0.1:3904/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:3904/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /livez {
        proxy_pass http://127.0.0.1:3904/livez;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # API contract document for quick testing.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:3904/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application API plane -> gateway (same-origin relative paths).
    location /app/v3/api/ {
        proxy_pass http://127.0.0.1:3904;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /backend/v3/api/ {
        proxy_pass http://127.0.0.1:3904;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /knowledge/v3/api/ {
        proxy_pass http://127.0.0.1:3904;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /internal/v3/api/ {
        proxy_pass http://127.0.0.1:3904;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Portal SPA: static assets + /index.html fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
