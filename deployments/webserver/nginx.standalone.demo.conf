# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/knowledgebase/webserver.pid;
error_log /var/log/sdkwork/knowledgebase/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name knowledgebase-demo.sdkwork.com knowledgebase-demo.birdcoder.com knowledgebase-demo.dtupay.com knowledgebase-demo.noaper.com knowledgebase-demo.sdkwork.cn knowledgebase-demo.birdcoder.cn knowledgebase-demo.dtupay.cn knowledgebase-demo.noaper.cn knowledgebase-demo.skubc.com knowledgebase-demo.skubc.cn knowledgebase-demo.zowalk.com knowledgebase-demo.zowalk.cn knowledgebase-demo.offer86.com knowledgebase-demo.offer86.cn knowledgebase-demo.86offer.com knowledgebase-demo.86offer.cn knowledgebase-admin-demo.sdkwork.com knowledgebase-admin-demo.birdcoder.com knowledgebase-admin-demo.dtupay.com knowledgebase-admin-demo.noaper.com knowledgebase-admin-demo.sdkwork.cn knowledgebase-admin-demo.birdcoder.cn knowledgebase-admin-demo.dtupay.cn knowledgebase-admin-demo.noaper.cn knowledgebase-admin-demo.skubc.com knowledgebase-admin-demo.skubc.cn knowledgebase-admin-demo.zowalk.com knowledgebase-admin-demo.zowalk.cn knowledgebase-admin-demo.offer86.com knowledgebase-admin-demo.offer86.cn knowledgebase-admin-demo.86offer.com knowledgebase-admin-demo.86offer.cn knowledge-demo.sdkwork.com knowledge-demo.birdcoder.com knowledge-demo.dtupay.com knowledge-demo.noaper.com knowledge-demo.sdkwork.cn knowledge-demo.birdcoder.cn knowledge-demo.dtupay.cn knowledge-demo.noaper.cn knowledge-demo.skubc.com knowledge-demo.skubc.cn knowledge-demo.zowalk.com knowledge-demo.zowalk.cn knowledge-demo.offer86.com knowledge-demo.offer86.cn knowledge-demo.86offer.com knowledge-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/knowledgebase/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
