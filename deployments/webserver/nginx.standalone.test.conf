# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/knowledgebase/webserver.pid;
error_log /var/log/sdkwork/knowledgebase/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name knowledgebase-test.sdkwork.com knowledgebase-test.birdcoder.com knowledgebase-test.dtupay.com knowledgebase-test.sdkwork.cn knowledgebase-test.birdcoder.cn knowledgebase-test.dtupay.cn knowledgebase-test.skubc.com knowledgebase-test.skubc.cn knowledgebase-test.zowalk.com knowledgebase-test.zowalk.cn knowledgebase-test.offer86.com knowledgebase-test.offer86.cn knowledgebase-test.86offer.com knowledgebase-test.86offer.cn knowledgebase-admin-test.sdkwork.com knowledgebase-admin-test.birdcoder.com knowledgebase-admin-test.dtupay.com knowledgebase-admin-test.sdkwork.cn knowledgebase-admin-test.birdcoder.cn knowledgebase-admin-test.dtupay.cn knowledgebase-admin-test.skubc.com knowledgebase-admin-test.skubc.cn knowledgebase-admin-test.zowalk.com knowledgebase-admin-test.zowalk.cn knowledgebase-admin-test.offer86.com knowledgebase-admin-test.offer86.cn knowledgebase-admin-test.86offer.com knowledgebase-admin-test.86offer.cn knowledge-test.sdkwork.com knowledge-test.birdcoder.com knowledge-test.dtupay.com knowledge-test.sdkwork.cn knowledge-test.birdcoder.cn knowledge-test.dtupay.cn knowledge-test.skubc.com knowledge-test.skubc.cn knowledge-test.zowalk.com knowledge-test.zowalk.cn knowledge-test.offer86.com knowledge-test.offer86.cn knowledge-test.86offer.com knowledge-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
