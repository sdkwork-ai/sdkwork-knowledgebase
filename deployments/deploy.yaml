version: 2
defaultProfile: cloud.production
profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: knowledge-test.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-test.sdkwork.com
          - knowledgebase-test.sdkwork.com
      - domain: knowledge-test.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-test.birdcoder.com
          - knowledgebase-test.birdcoder.com
      - domain: knowledge-test.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-test.dtupay.com
          - knowledgebase-test.dtupay.com
      - domain: knowledge-test.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-test.sdkwork.cn
          - knowledgebase-test.sdkwork.cn
      - domain: knowledge-test.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-test.birdcoder.cn
          - knowledgebase-test.birdcoder.cn
      - domain: knowledge-test.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-test.dtupay.cn
          - knowledgebase-test.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      kubernetes:
        reference: deployments/kubernetes/
  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: knowledge-staging.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-staging.sdkwork.com
          - knowledgebase-staging.sdkwork.com
      - domain: knowledge-staging.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-staging.birdcoder.com
          - knowledgebase-staging.birdcoder.com
      - domain: knowledge-staging.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-staging.dtupay.com
          - knowledgebase-staging.dtupay.com
      - domain: knowledge-staging.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-staging.sdkwork.cn
          - knowledgebase-staging.sdkwork.cn
      - domain: knowledge-staging.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-staging.birdcoder.cn
          - knowledgebase-staging.birdcoder.cn
      - domain: knowledge-staging.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin-staging.dtupay.cn
          - knowledgebase-staging.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      kubernetes:
        reference: deployments/kubernetes/
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: knowledge.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.sdkwork.com
          - knowledgebase.sdkwork.com
      - domain: knowledge.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.birdcoder.com
          - knowledgebase.birdcoder.com
      - domain: knowledge.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.dtupay.com
          - knowledgebase.dtupay.com
      - domain: knowledge.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.sdkwork.cn
          - knowledgebase.sdkwork.cn
      - domain: knowledge.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.birdcoder.cn
          - knowledgebase.birdcoder.cn
      - domain: knowledge.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.dtupay.cn
          - knowledgebase.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: knowledge.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
        aliases:
          - knowledgebase-admin.sdkwork.com
          - knowledgebase.sdkwork.com
      - domain: knowledge.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
        aliases:
          - knowledgebase-admin.birdcoder.com
          - knowledgebase.birdcoder.com
      - domain: knowledge.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
        aliases:
          - knowledgebase-admin.dtupay.com
          - knowledgebase.dtupay.com
      - domain: knowledge.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
        aliases:
          - knowledgebase-admin.sdkwork.cn
          - knowledgebase.sdkwork.cn
      - domain: knowledge.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
        aliases:
          - knowledgebase-admin.birdcoder.cn
          - knowledgebase.birdcoder.cn
      - domain: knowledge.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
        aliases:
          - knowledgebase-admin.dtupay.cn
          - knowledgebase.dtupay.cn
    packages:
      - desktop-windows
      - desktop-macos
      - desktop-linux
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:18081
          platform.api-gateway: http://127.0.0.1:3900
      nginx:
        clientMaxBodySize: 32m
