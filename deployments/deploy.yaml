version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: knowledge.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.sdkwork.com
          - knowledgebase.sdkwork.com
      - domain: knowledge.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
        aliases:
          - knowledgebase-admin.birdcoder.com
          - knowledgebase.birdcoder.com
      - domain: knowledge.dtupay.com
