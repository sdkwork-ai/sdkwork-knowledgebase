[package]
name = "sdkwork-routes-knowledgebase-app-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sdkwork-knowledgebase-contract.workspace = true
sdkwork-knowledgebase-drive.workspace = true
sdkwork-iam-web-adapter.workspace = true
sdkwork-utils-rust.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-web-core.workspace = true
sdkwork-web-bootstrap.workspace = true
sdkwork-routes-knowledgebase-backend-api.workspace = true
sdkwork-routes-knowledgebase-internal-api.workspace = true
sdkwork-routes-knowledgebase-open-api.workspace = true
sdkwork-drive-storage-local = { workspace = true }
sdkwork-intelligence-knowledgebase-service.workspace = true
sdkwork-intelligence-knowledgebase-repository-sqlx.workspace = true
sdkwork-database-id.workspace = true
sdkwork-database-config.workspace = true
sdkwork-knowledgebase-agent-provider.workspace = true
sdkwork-knowledgebase-engine-dify.workspace = true
sdkwork-knowledgebase-engine-ragflow.workspace = true
sdkwork-knowledgebase-engine-onyx.workspace = true
sdkwork-knowledgebase-engine-anythingllm.workspace = true
sdkwork-knowledgebase-engine-open-webui.workspace = true
sdkwork-knowledgebase-engine-flowise.workspace = true
sdkwork-knowledgebase-engine-qdrant.workspace = true
sdkwork-knowledgebase-engine-weaviate.workspace = true
sdkwork-knowledgebase-engine-haystack.workspace = true
sdkwork-knowledgebase-engine-chroma.workspace = true
cloudrouter-open-sdk.workspace = true
sdkwork-agent-kernel.workspace = true
sdkwork-knowledgebase-observability.workspace = true
sdkwork-knowledgebase-provider-secret-adapter.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "any"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "fs"] }
tracing = "0.1"
time.workspace = true
uuid.workspace = true
url = "2"

[features]
# Development-only unauthenticated auth middlewares. Compiled only when explicitly
# requested; never enabled in release/deployment builds.
dev-auth = []

[dev-dependencies]
# Integration tests exercise the development auth middlewares, so the crate's own test
# build enables the dev-auth feature.
sdkwork-routes-knowledgebase-app-api = { workspace = true, features = ["dev-auth"] }
async-trait.workspace = true
tower.workspace = true
serde_json.workspace = true
wiremock.workspace = true
sdkwork-knowledgebase-observability.workspace = true
sdkwork-knowledgebase-worker.workspace = true
sdkwork-knowledgebase-contract.workspace = true
sdkwork-drive-contract.workspace = true
sdkwork-knowledgebase-test-support.workspace = true
